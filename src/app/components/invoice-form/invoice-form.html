<div class="bg-white rounded-lg shadow-md p-6 space-y-6">

    <!-- Company Details -->
    <div>
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            <i class="fas fa-building mr-2 text-blue-600"></i> My Company
        </h2>
        <div class="space-y-3">
            <label class="block">
                <span class="text-gray-600 text-sm">Company Name</span>
                <input type="text" [(ngModel)]="company().name" (ngModelChange)="updateCompany()"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
            <label class="block">
                <span class="text-gray-600 text-sm">Address</span>
                <textarea [(ngModel)]="company().address" (ngModelChange)="updateCompany()" rows="2"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </label>
            <label class="block">
                <span class="text-gray-600 text-sm">Phone</span>
                <input type="text" [(ngModel)]="company().phone" (ngModelChange)="updateCompany()"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
            <label class="block">
                <span class="text-gray-600 text-sm">Email</span>
                <input type="email" [(ngModel)]="company().email" (ngModelChange)="updateCompany()"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
        </div>
    </div>

    <hr class="border-gray-200">

    <!-- Invoice Details -->
    <div>
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            <i class="fas fa-file-invoice mr-2 text-blue-600"></i> Invoice Details
        </h2>
        <div class="space-y-3">
            <label class="block">
                <span class="text-gray-600 text-sm">Invoice #</span>
                <input type="text" [ngModel]="invoiceService.invoiceNumber()"
                    (ngModelChange)="invoiceService.invoiceNumber.set($event)"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
            <label class="block">
                <span class="text-gray-600 text-sm">Date</span>
                <input type="date" [ngModel]="dateStr" (ngModelChange)="updateDate($event)"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
        </div>
    </div>

    <hr class="border-gray-200">

    <!-- Customer Details -->
    <div>
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            <i class="fas fa-user mr-2 text-blue-600"></i> Bill To
        </h2>
        <div class="space-y-3">
            <label class="block">
                <span class="text-gray-600 text-sm">Customer Name</span>
                <input type="text" [(ngModel)]="customer().name" (ngModelChange)="updateCustomer()"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
            <label class="block">
                <span class="text-gray-600 text-sm">Address</span>
                <textarea [(ngModel)]="customer().address" (ngModelChange)="updateCustomer()" rows="2"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </label>
            <label class="block">
                <span class="text-gray-600 text-sm">Mobile No.</span>
                <input type="text" [(ngModel)]="customer().mobile" (ngModelChange)="updateCustomer()"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
            <label class="block">
                <span class="text-gray-600 text-sm">Email</span>
                <input type="email" [(ngModel)]="customer().email" (ngModelChange)="updateCustomer()"
                    class="w-full border rounded px-3 py-2 mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
            </label>
        </div>
    </div>

</div>
